<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Outline Editor</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#dce2e8;--muted:#596979;--ink:#182532;--accent:#155b78;--selected:#e6f2f8;--danger:#a32929;--focus:#287ba2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:7px}button:hover:not(:disabled){background:#edf3f6}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #72b7d8;outline-offset:1px}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:#0d4a64}button.danger{color:var(--danger)}button.small{padding:5px 8px;font-size:13px}input,textarea{width:100%;background:#fff;color:var(--ink);padding:10px;border:1px solid #cdd7e0;border-radius:7px}textarea{min-height:170px;resize:vertical;line-height:1.5}h1,h2,h3,p{margin:0}h1{font-size:19px}h2{font-size:17px}header{padding:13px clamp(12px,3vw,25px);background:#fff;border-bottom:1px solid var(--line)}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.brand p,.subtle{font-size:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.app{display:grid;grid-template-columns:minmax(330px,48%) minmax(300px,1fr);height:calc(100dvh - 83px);min-height:480px}.pane{min-width:0;display:flex;flex-direction:column;overflow:hidden}.treepane{border-right:1px solid var(--line);background:#fff}.panehead{padding:12px 15px;border-bottom:1px solid var(--line);display:grid;gap:10px}.panehead .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.toolbar{display:flex;flex-wrap:wrap;gap:6px}.treescroll{padding:10px 8px 30px;overflow:auto;flex:1}.tree-row{display:flex;align-items:flex-start;gap:4px;min-height:36px;margin:1px 0;border-radius:8px}.tree-row:hover{background:#f0f5f8}.tree-row.current{background:var(--selected)}.tree-toggle{width:28px;min-width:28px;border:0;background:transparent;padding:6px 0;color:#61768a}.tree-toggle.blank{visibility:hidden}.tree-target{flex:1;text-align:left;display:flex;gap:9px;align-items:baseline;border:0;background:transparent;min-width:0;padding:8px 5px;line-height:1.35}.tree-target:hover{background:transparent!important}.num{font-variant-numeric:tabular-nums;flex:none;color:#2d6784;font-weight:650;font-size:13px}.node-title{overflow-wrap:anywhere}.tree-row.current .node-title{font-weight:650}.node-meta{flex:none;color:var(--muted);font-size:11px;padding:9px 8px 0 0}.noresults{padding:18px;color:var(--muted)}.details{background:var(--bg)}.detail-scroll{padding:clamp(14px,3vw,26px);overflow:auto;flex:1}.sheet{max-width:850px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:13px;padding:clamp(15px,2.5vw,25px)}.reference{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.reference b{color:var(--accent);font-size:18px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field .hint{font-size:12px;color:var(--muted);font-weight:400}.sheet textarea{min-height:220px}.edit-actions{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.sectionline{border-top:1px solid var(--line);margin:20px 0}.permaid{font-size:12px;color:var(--muted);word-break:break-all}.status{padding:8px 15px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.empty{max-width:600px;margin:15vh auto;color:var(--muted);text-align:center}.empty h2{color:var(--ink);margin-bottom:8px}.notice{background:#eef5f9;border:1px solid #b7d3e3;border-radius:8px;padding:12px;color:#294b61;font-size:13px;margin-top:16px}.dialog{border:1px solid var(--line);border-radius:12px;padding:22px;max-width:min(680px,94vw);width:100%;box-shadow:0 15px 55px #0004}.dialog::backdrop{background:#11202d80}.dialog h2{margin-bottom:10px}.dialog p{margin:9px 0;color:var(--muted)}.dialog textarea{height:270px;font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.dialog .footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}.error{color:var(--danger)!important;font-size:13px;min-height:17px}.kbd{font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11px}.sr{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@media(max-width:750px){.app{height:auto;display:flex;flex-direction:column}.treepane{border-right:0;border-bottom:1px solid var(--line);height:46dvh;min-height:310px}.details{min-height:450px}.panehead{padding:10px}.detail-scroll{padding:12px}.sheet{border-radius:10px}.node-meta{display:none}header{padding:10px 12px}.actions{gap:5px}h1{font-size:17px}}@media(prefers-reduced-motion:no-preference){.tree-row{transition:background .12s}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><h1>Horizon Outline Editor</h1><p>Offline · single-file · JSON-based</p></div><div class="actions"><a href="index.html">Back to Planetary Sandbox</a><button id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button><button id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button><button id="importBtn">Import JSON</button><button id="exportBtn" class="primary">Export JSON</button><button id="moreBtn" title="Copy or paste JSON">JSON tools</button></div></div></header>
<main class="app">
<section class="pane treepane" aria-label="Outline"><div class="panehead"><div class="bar"><h2>Outline <span id="count" class="subtle"></span></h2><div class="toolbar"><button id="expandBtn" class="small">Expand all</button><button id="collapseBtn" class="small">Collapse all</button></div></div><input id="search" type="search" placeholder="Find items by title or notes…" aria-label="Search outline"><div class="toolbar"><button id="newRootBtn" class="small primary">+ Top-level item</button><button id="addChildBtn" class="small">+ Child</button><button id="addSiblingBtn" class="small">+ Sibling</button></div></div><div id="tree" class="treescroll" role="tree" aria-label="Outline tree"></div><div class="status"><span id="treeStatus">Ready</span><span id="saveState">Saved locally</span></div></section>
<section class="pane details" aria-label="Item editor"><div class="detail-scroll" id="details"></div></section>
</main>
<input id="fileInput" class="sr" type="file" accept=".json,application/json">
<dialog id="jsonDialog" class="dialog"><h2>JSON tools</h2><p>Copy the entire outline for an AI assistant, or paste a full outline JSON document to replace the current one.</p><textarea id="jsonArea" spellcheck="false" aria-label="JSON document"></textarea><p id="jsonError" class="error" role="alert"></p><div class="footer"><button id="copyJsonBtn">Copy JSON</button><button id="pasteJsonBtn" class="danger">Replace outline with pasted JSON</button><button id="closeJsonBtn">Close</button></div></dialog>
<script>
(()=>{'use strict';
const STORAGE='horizon-outline-editor-v1';
const initialTitles=[
'World seed and physical planetary parameters are established.',
'Initial geological conditions and planetary evolution are modeled.',
'Continental structure, geological provinces and regional uplift are determined.',
'Climate, water, erosion and terrain development are resolved through appropriately coupled processes.',
'Major geographic features, drainage networks and environmental constraints become stable.',
'Regional and local terrain is generated deterministically at requested resolutions.',
'Soils, substrates, ecosystems and vegetation are resolved from environmental conditions.',
'Atlas and Explorer render their respective representations of the same world.',
'Player-created infrastructure is loaded, positioned and reconciled with the generated environment.'
];
const $=id=>document.getElementById(id);
function uuid(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();return 'n-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)}
function fresh(){return {format:'horizon-outline',version:1,title:'Horizon — Master Roadmap',nodes:initialTitles.map(title=>({id:uuid(),title,notes:'',children:[]}))};}
function clone(x){return JSON.parse(JSON.stringify(x))}
// The visible reference (e.g., 4.2.1) is positional and changes on move.
// id is permanent and survives moves/renumbering; use it for external links.
function validate(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.format!=='horizon-outline'||raw.version!==1||typeof raw.title!=='string'||!Array.isArray(raw.nodes))throw Error('Expected a Horizon outline JSON document (format: horizon-outline, version: 1, nodes: array).');
 const seen=new Set();let count=0;
 function check(nodes,depth){if(depth>40)throw Error('Outline exceeds 40 nesting levels.');for(const n of nodes){count++;if(count>20000)throw Error('Outline exceeds 20,000 items.');if(!n||typeof n!=='object'||Array.isArray(n)||typeof n.id!=='string'||!n.id.trim()||seen.has(n.id))throw Error('Every item needs a unique, nonempty string id.');seen.add(n.id);if(typeof n.title!=='string'||typeof n.notes!=='string'||!Array.isArray(n.children))throw Error('Every item must have title and notes strings and a children array.');check(n.children,depth+1)}}
 check(raw.nodes,0);return {format:'horizon-outline',version:1,title:raw.title,nodes:clone(raw.nodes)};
}
let doc;try{doc=validate(JSON.parse(localStorage.getItem(STORAGE)))}catch{doc=fresh()}
let selected=doc.nodes[0]?.id||null,collapsed=new Set(),search='',undo=[],redo=[],dirty=false,flushTimer=null,editTimer=null;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function all(){const out=[];function walk(nodes,parent=null,prefix=''){nodes.forEach((node,index)=>{const ref=prefix?prefix+'.'+(index+1):''+(index+1);out.push({node,parent,nodes,index,ref,depth:ref.split('.').length});walk(node.children,node,ref)})}walk(doc.nodes);return out}
function lookup(id){return all().find(x=>x.node.id===id)||null}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(doc));dirty=false;$('saveState').textContent='Saved locally'}catch(e){$('saveState').textContent='Local save unavailable — export JSON';console.warn(e)}}
function markDirty(){dirty=true;$('saveState').textContent='Saving…';clearTimeout(flushTimer);flushTimer=setTimeout(persist,250)}
function commit(mutator){flushEdits();undo.push(clone(doc));if(undo.length>60)undo.shift();redo=[];mutator();markDirty();render()}
function flushEdits(){clearTimeout(editTimer);editTimer=null}
function findParentArray(entry){return entry.parent?entry.parent.children:doc.nodes}
function setSelected(id){flushEdits();selected=id;render()}
function toggle(id){if(collapsed.has(id))collapsed.delete(id);else collapsed.add(id);renderTree()}
function isMatching(node,q){if((node.title+' '+node.notes).toLowerCase().includes(q))return true;return node.children.some(child=>isMatching(child,q))}
function renderTree(){const entries=all();$('count').textContent=`(${entries.length})`;const q=search.trim().toLowerCase();let html='';function walk(nodes,prefix='',depth=0){nodes.forEach((n,i)=>{if(q&&!isMatching(n,q))return;const ref=prefix?prefix+'.'+(i+1):''+(i+1),has=n.children.length>0,closed=!q&&collapsed.has(n.id);html+=`<div class="tree-row ${selected===n.id?'current':''}" role="treeitem" aria-selected="${selected===n.id}" aria-level="${depth+1}" ${has?`aria-expanded="${!closed}"`:''} style="padding-left:${Math.min(depth,18)*15}px"><button class="tree-toggle ${has?'':'blank'}" data-act="toggle" data-id="${escapeHtml(n.id)}" aria-label="${closed?'Expand':'Collapse'} ${escapeHtml(n.title)}">${closed?'▸':'▾'}</button><button class="tree-target" data-act="select" data-id="${escapeHtml(n.id)}" title="${escapeHtml(ref+' '+n.title)}"><span class="num">${ref}</span><span class="node-title">${escapeHtml(n.title||'(Untitled)')}</span></button>${has?`<span class="node-meta">${n.children.length}</span>`:''}</div>`;if(has&&!closed)walk(n.children,ref,depth+1)})}walk(doc.nodes);$('tree').innerHTML=html||'<div class="noresults">No matching items.</div>';$('treeStatus').textContent=q?`${entries.filter(e=>(e.node.title+' '+e.node.notes).toLowerCase().includes(q)).length} direct matches`:'Numbers reflect current order';$('addChildBtn').disabled=!selected;$('addSiblingBtn').disabled=!selected}
function renderDetails(){const e=lookup(selected),d=$('details');if(!e){d.innerHTML='<div class="empty"><h2>Select an item</h2><p>Choose an outline item to edit its title, notes, and position.</p></div>';return}
 const atRoot=!e.parent;d.innerHTML=`<div class="sheet"><div class="reference"><span>Reference <b>${e.ref}</b></span><button class="small" id="copyRef">Copy reference</button></div><div class="field"><label for="nodeTitle">Title</label><input id="nodeTitle" maxlength="500" autocomplete="off" value="${escapeHtml(e.node.title)}"></div><div class="field"><label for="nodeNotes">Notes <span class="hint">optional; plain text, supports multiple lines</span></label><textarea id="nodeNotes" spellcheck="true">${escapeHtml(e.node.notes)}</textarea></div><div class="edit-actions"><button class="primary" data-op="child">+ Add child</button><button data-op="sibling">+ Add sibling</button><button data-op="up" ${e.index===0?'disabled':''}>↑ Up</button><button data-op="down" ${e.index===e.nodes.length-1?'disabled':''}>↓ Down</button><button data-op="indent" ${e.index===0?'disabled':''} title="Move under the preceding sibling">→ Indent</button><button data-op="outdent" ${atRoot?'disabled':''} title="Move after the parent">← Outdent</button></div><div class="sectionline"></div><div class="permaid"><b>Permanent ID:</b> <span id="idText">${escapeHtml(e.node.id)}</span> <button class="small" id="copyId">Copy ID</button></div><div class="edit-actions"><button class="danger" data-op="delete">Delete item${e.node.children.length?' and descendants':''}</button></div><div class="notice">References such as <b>${e.ref}</b> are calculated from the outline order and change when items move. Permanent IDs do not change. Export a JSON file to back up your work or transfer it to another device; browser autosave is local to this browser and file location.</div></div>`;
 $('nodeTitle').addEventListener('input',event=>fieldChanged('title',event.target.value));$('nodeNotes').addEventListener('input',event=>fieldChanged('notes',event.target.value));d.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>operate(b.dataset.op));$('copyRef').onclick=()=>copyText(`${e.ref} ${e.node.title} [id:${e.node.id}]`);$('copyId').onclick=()=>copyText(e.node.id);
}
function render(){renderTree();renderDetails();$('undoBtn').disabled=!undo.length;$('redoBtn').disabled=!redo.length}
function fieldChanged(key,value){const e=lookup(selected);if(!e)return;if(!editTimer){undo.push(clone(doc));if(undo.length>60)undo.shift();redo=[]}e.node[key]=value;markDirty();clearTimeout(editTimer);editTimer=setTimeout(()=>{editTimer=null;renderTree();$('undoBtn').disabled=!undo.length;$('redoBtn').disabled=true},450);if(key==='title')renderTree()}
function addNode(kind){commit(()=>{const item={id:uuid(),title:'New item',notes:'',children:[]};if(kind==='root')doc.nodes.push(item);else{let e=lookup(selected);if(!e){doc.nodes.push(item)}else if(kind==='child'){e.node.children.push(item);collapsed.delete(e.node.id)}else{e.nodes.splice(e.index+1,0,item)}}selected=item.id});$('nodeTitle')?.focus();$('nodeTitle')?.select()}
function operate(op){const e=lookup(selected);if(!e)return;if(op==='child'||op==='sibling'){addNode(op);return}if(op==='delete'){const n=descendants(e.node);if(!confirm(`Delete item ${e.ref} and ${n-1} descendant(s)? This can be undone.`))return;commit(()=>{e.nodes.splice(e.index,1);selected=e.parent?.id||e.nodes[Math.min(e.index,e.nodes.length-1)]?.id||doc.nodes[0]?.id||null});return}
 commit(()=>{let a=e.nodes;switch(op){case 'up':if(e.index>0)[a[e.index-1],a[e.index]]=[a[e.index],a[e.index-1]];break;case 'down':if(e.index<a.length-1)[a[e.index+1],a[e.index]]=[a[e.index],a[e.index+1]];break;case 'indent':if(e.index>0){const p=a[e.index-1];a.splice(e.index,1);p.children.push(e.node);collapsed.delete(p.id)}break;case 'outdent':if(e.parent){a.splice(e.index,1);const p=lookup(e.parent.id);p.nodes.splice(p.index+1,0,e.node)}break}})}
function descendants(n){return 1+n.children.reduce((sum,c)=>sum+descendants(c),0)}
function history(kind){flushEdits();const from=kind==='undo'?undo:redo,to=kind==='undo'?redo:undo;if(!from.length)return;to.push(clone(doc));doc=from.pop();if(selected&&!lookup(selected))selected=doc.nodes[0]?.id||null;markDirty();render()}
function exportData(){flushEdits();persist();const data=JSON.stringify(doc,null,2)+'\n',blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='horizon-outline.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function replaceDoc(raw){const newDoc=validate(raw);if(!confirm('Replace the current outline with the imported document? You can undo this action.'))return false;commit(()=>{doc=newDoc;selected=doc.nodes[0]?.id||null;collapsed.clear();search='';$('search').value=''});return true}
async function copyText(t){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(t)}else{const tmp=document.createElement('textarea');tmp.value=t;tmp.style.position='fixed';tmp.style.opacity='0';document.body.appendChild(tmp);tmp.select();if(!document.execCommand('copy'))throw Error('Clipboard unavailable');tmp.remove()}$('treeStatus').textContent='Copied to clipboard'}catch{alert('Clipboard access unavailable. Use JSON tools to select and copy the text manually.')}}
$('tree').onclick=e=>{const b=e.target.closest('button[data-act]');if(!b)return;b.dataset.act==='select'?setSelected(b.dataset.id):toggle(b.dataset.id)};
$('search').oninput=e=>{search=e.target.value;renderTree()};$('expandBtn').onclick=()=>{collapsed.clear();renderTree()};$('collapseBtn').onclick=()=>{collapsed=new Set(all().filter(e=>e.node.children.length).map(e=>e.node.id));renderTree()};
$('newRootBtn').onclick=()=>addNode('root');$('addChildBtn').onclick=()=>addNode('child');$('addSiblingBtn').onclick=()=>addNode('sibling');$('undoBtn').onclick=()=>history('undo');$('redoBtn').onclick=()=>history('redo');$('exportBtn').onclick=exportData;
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{replaceDoc(JSON.parse(await f.text()))}catch(err){alert('Cannot import JSON: '+err.message)}e.target.value=''};
$('moreBtn').onclick=()=>{$('jsonArea').value=JSON.stringify(doc,null,2);$('jsonError').textContent='';$('jsonDialog').showModal()};$('closeJsonBtn').onclick=()=>$('jsonDialog').close();$('copyJsonBtn').onclick=()=>copyText($('jsonArea').value);$('pasteJsonBtn').onclick=()=>{try{if(replaceDoc(JSON.parse($('jsonArea').value)))$('jsonDialog').close()}catch(err){$('jsonError').textContent=err.message}};
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();if(k==='s'){e.preventDefault();exportData()}else if(k==='z'){e.preventDefault();history(e.shiftKey?'redo':'undo')}else if(k==='y'){e.preventDefault();history('redo')}});
window.addEventListener('beforeunload',e=>{if(dirty)persist()});
render();persist();
})();
</script>
</body>
</html>
